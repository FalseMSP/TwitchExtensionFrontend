<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RedStreamIntegration — Configuration</title>
<style>
  :root {
    --bg: #0d0d0f; --surface: #16171a; --surface2: #1c1d21;
    --border: #2a2b30; --accent: #e53935; --text: #e8e8ec; --muted: #5a5a6a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px;
  }
  .box {
    max-width: 440px; text-align: center;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 28px 24px;
  }
  .box svg { width: 36px; height: 36px; color: var(--accent); margin-bottom: 14px; }
  .box h1 { font-size: 17px; margin: 0 0 8px; font-weight: 700; }
  .box p { margin: 0; color: var(--muted); font-size: 13px; }
  .box .ok {
    display: inline-block; margin-top: 14px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--accent);
    border: 1px solid rgba(229,57,53,0.4); border-radius: 3px; padding: 4px 10px;
  }
</style>
</head>
<body>
<div class="box">
  <svg viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <circle cx="11" cy="11" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/>
    <path d="M7 11.5l2.8 2.8L15.5 8.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <h1>RedStreamIntegration</h1>
  <p>No configuration needed — this extension works out of the box. The queue is managed by the streamer's bot. Just activate it and assign it to a panel slot.</p>
  <span class="ok">Ready</span>
</div>
</body>
</html>
